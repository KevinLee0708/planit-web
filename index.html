<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planit - Plan your world</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="dropdown logo-group">
                    <a href="./" class="logo">Planit</a>
                    <ul class="dropdown-menu">
                        <li><a href="about/">About us</a></li>
                        <li><a href="download/">설치</a></li>
                    </ul>
                </div>
            </div>

            <div class="nav-right">
                <div class="desktop-menu-group desktop-only">
                    <div class="dropdown">
                        <button class="nav-btn">커뮤니티</button>
                        <ul class="dropdown-menu">
                            <li><a href="community/free/">자유게시판</a></li>
                            <li><a href="community/bug/">버그신고</a></li>
                        </ul>
                    </div>

                    <div class="dropdown auth-dropdown">
                        <button class="btn-icon-auth" aria-label="계정">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </button>
                        <ul class="dropdown-menu align-right">
                            <li><a href="login/">로그인</a></li>
                            <li><a href="signup/">회원가입</a></li>
                        </ul>
                    </div>
                </div>

                <button class="hamburger" id="menu-toggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <aside class="mobile-sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo">Planit</span>
            <button class="close-btn" id="menu-close">&times;</button>
        </div>
        <nav class="mobile-nav">
            <a href="about/">About us</a>
            <a href="download/">설치</a>
            <div class="mobile-accordion">
                <button class="accordion-trigger">커뮤니티 <span class="arrow-icon"></span></button>
                <div class="accordion-content">
                    <a href="community/free/">자유게시판</a>
                    <a href="community/bug/">버그신고</a>
                </div>
            </div>
            <hr class="nav-divider">
            <a href="login/">로그인</a>
            <a href="signup/">회원가입</a>
        </nav>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main class="hero">
        <div class="hero-inner">
            <h1 class="hero-title">Plan your world</h1>
            <p class="hero-desc">당신의 일정, 하나의 공간에서</p>
            <a href="download/" class="btn-cta">설치하기</a>
        </div>
        <div class="glow-effect"></div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
