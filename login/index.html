<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Planit — Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css?v=2026.final.fixed">
</head>
<body class="auth-page">

    <div class="auth-bg-glow"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="../index.html" class="auth-logo">Planit</a>
                <h1>Welcome Back</h1>
                <p>Planit 계정으로 로그인하여 세션을 동기화하세요</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="login-email">이메일</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="login-password">비밀번호</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="비밀번호 입력" required>
                        <button type="button" id="btn-toggle-password" class="password-toggle-btn" aria-label="비밀번호 보기">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="forgot-password-wrapper" style="text-align: right; margin-top: -8px; margin-bottom: 15px;">
                    <button type="button" id="btn-forgot-password" style="background: none; border: none; padding: 0; font-size: 13px; color: #00F0FF; text-decoration: none; cursor: pointer; font-weight: 500; font-family: inherit;">비밀번호를 잊으셨나요?</button>
                </div>

                <button type="submit" class="btn-auth-submit" id="btn-login">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>
            
            <div class="auth-footer">
                아직 계정이 없으신가요? <a href="../registar/index.html">회원가입</a>
            </div>
        </div>
    </div>

    <div id="reset-pwd-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 11, 19, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: #0d131e; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; width: 90%; max-width: 400px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); box-sizing: border-box;">
            <h3 style="color: #ffffff; margin-top: 0; margin-bottom: 8px; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em;">비밀번호 재설정</h3>
            <p style="color: #8A919E; font-size: 0.88rem; line-height: 1.5; margin-bottom: 20px;">가입하신 이메일 주소를 입력하시면 비밀번호를 변경할 수 있는 링크를 메일로 발송해 드립니다.</p>
            
            <div class="input-group" style="margin-bottom: 24px; text-align: left;">
                <label for="reset-email-input" style="display: block; color: #ffffff; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">이메일 주소</label>
                <input type="email" id="reset-email-input" placeholder="example@domain.com" style="width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #ffffff; font-size: 0.95rem; box-sizing: border-box; outline: none;">
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" id="btn-reset-cancel" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); color: #8A919E; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer;">취소</button>
                <button type="button" id="btn-reset-submit" style="background: #00F0FF; border: none; color: #070B13; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer;">초기화 메일 전송</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/login.js?v=2026.final.fixed"></script>
</body>
</html>
