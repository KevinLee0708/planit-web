<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>준비중 - Planit</title>
    <style>
        body {
            background: #050505; color: #fff; font-family: 'Inter', sans-serif;
            height: 100vh; display: flex; align-items: center; justify-content: center;
            margin: 0; text-align: center;
        }
        .container { padding: 20px; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        p { color: #888; font-size: 1.2rem; margin-bottom: 30px; }
        .btn-home {
            background: #fff; color: #000; text-decoration: none;
            padding: 12px 32px; border-radius: 50px; font-weight: 600;
            transition: 0.3s;
        }
        .btn-home:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚧 현재 개발중입니다</h1>
        <p>더 나은 서비스를 위해 준비하고 있습니다.<br>곧 만나보실 수 있습니다.</p>
        <a href="/" class="btn-home">홈으로 돌아가기</a>
    </div>
</body>
</html>
