<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../../assets/logos/Planit-Logo.png">
    <title>Planit — Create Announcement</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../../../css/community.css?v=20260526">
</head>
<body>
    <div class="saas-container">
        <header class="write-header">
            <h2>공지사항 작성</h2>
        </header>

        <form id="write-form" class="glass-form">
            <div class="form-group">
                <label class="toggle-container">
                    <input type="checkbox" id="field-important">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">이 게시글을 상단에 고정 (중요 공지)</span>
                </label>
            </div>

            <div class="form-group">
                <input type="text" id="field-title" placeholder="공지 제목을 입력하세요" autocomplete="off">
            </div>

            <div class="form-group">
                <div id="editor-container"></div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="history.back()">취소</button>
                <button type="submit" class="btn-submit">공지사항 게시</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module" src="../../../js/notice/write.js"></script>
</body>
</html>
