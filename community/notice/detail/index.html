<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planit — 로딩 중</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/navbar.css">
    <link rel="stylesheet" href="../../../css/community.css?v=20260527">
</head>
<body>

    <header class="navbar" id="global-nav">
        <div class="nav-container">
            <div class="nav-left">
                <div class="dropdown brand-dropdown">
                    <a href="../../../" class="brand-link">
                        <img src="../../../assets/logos/Planit-Logo-White.png" alt="Planit" class="nav-logo">
                    </a>
                    <ul class="dropdown-menu">
                        <li><a href="../../../download/">설치</a></li>
                        <li><a href="../../../about/">About us</a></li>
                        <hr class="divider">
                        <li><a href="../../../velora/" class="studio-link">Velora Studio</a></li>
                    </ul>
                </div>
            </div>

            <div class="nav-right">
                <nav class="desktop-only-group desktop-only">
                    <div class="dropdown">
                        <button class="nav-txt-btn">COMMUNITY</button>
                        <ul class="dropdown-menu align-right">
                            <li><a href="../../../community/notice/">공지사항</a></li>
                            <li><a href="../../../community/free/">자유게시판</a></li>
                            <li><a href="../../../community/chat/" class="support-link">1:1 CHAT</a></li>
                        </ul>
                    </div>

                    <div class="dropdown devlog-dropdown">
                        <button class="nav-txt-btn devlog-btn">DEVLOG</button>
                        <ul class="dropdown-menu align-right">
                            <li><a href="../../../devlog/update/">Update Log</a></li>
                            <li><a href="../../../devlog/bug-report/">버그 신고</a></li>
                        </ul>
                    </div>
                    
                    <a href="../../../download/" class="cta-install-btn">웹버전 사용하기</a>

                    <div class="noti-wrapper" id="notification-wrapper" style="position: relative; display: inline-flex; align-items: center; justify-content: center;">
                        <button class="noti-trigger-btn" id="noti-trigger" aria-label="알림 열기" type="button" style="background: transparent !important; border: none !important; outline: none !important; padding: 8px !important; margin: 0 !important; cursor: pointer; display: flex !important; align-items: center; justify-content: center; position: relative !important;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #ffffff !important;">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                            <span class="noti-badge" id="noti-badge-count" style="position: absolute !important; top: 2px !important; right: 2px !important; transform: translate(20%, -20%) !important; background: #FF4B4B !important; color: #ffffff !important; font-size: 10px !important; font-weight: 700 !important; padding: 2px 5px !important; border-radius: 10px !important; min-width: 14px !important; text-align: center !important; line-height: 1 !important; border: 1.5px solid #0b0f17 !important; box-sizing: border-box !important; display: inline-block !important;">0</span>
                        </button>
                        
                        <div class="noti-dropdown" id="noti-dropdown-layer" style="position: absolute !important; top: 100% !important; right: 0 !important; width: 320px !important; margin-top: 12px !important; padding: 16px !important; box-sizing: border-box !important; background: rgba(13, 19, 30, 0.96) !important; backdrop-filter: blur(16px) !important; -webkit-backdrop-filter: blur(16px) !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; border-radius: 12px !important; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6) !important; z-index: 9999 !important; display: none;">
                            <div class="noti-header" style="display: flex !important; justify-content: space-between !important; align-items: center !important; padding-bottom: 12px !important; margin-bottom: 12px !important; border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;">
                                <span class="noti-title" style="color: #ffffff !important; font-size: 0.9rem !important; font-weight: 700 !important; letter-spacing: -0.02em !important;">최신 알림</span>
                                <button type="button" class="noti-clear-all-btn" id="noti-clear-all" style="background: rgba(255, 255, 255, 0.04) !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; color: #8A919E !important; font-size: 0.75rem !important; font-weight: 600 !important; padding: 4px 10px !important; border-radius: 6px !important; cursor: pointer !important;">모두 읽음</button>
                            </div>
                            <ul class="noti-list" id="noti-list-container" style="list-style: none !important; padding: 0 !important; margin: 0 !important; max-height: 260px; overflow-y: auto;">
                                <li class="noti-empty" id="noti-empty-state" style="color: #626975 !important; font-size: 0.85rem !important; text-align: center !important; padding: 32px 0 !important; font-weight: 500 !important;">새로운 알림이 없습니다.</li>
                            </ul>
                        </div>
                    </div>

                    <div class="dropdown auth-dropdown">
                        <button class="icon-auth-btn" id="auth-trigger-btn" aria-label="계정 메뉴" type="button">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </button>
                        <ul class="dropdown-menu align-right" id="auth-menu-list"></ul>
                    </div>
                </nav>

                <button class="hamburger-btn" id="menu-toggle" aria-label="메뉴 열기">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <aside class="sidebar" id="mobile-sidebar">
        <div class="sidebar-inner">
            <div class="sidebar-top">
                <img src="../../../assets/logos/Planit-Logo-White.png" alt="Planit" class="nav-logo-sm">
                <button class="close-btn" id="menu-close" aria-label="메뉴 닫기">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <nav class="sidebar-links">
                <a href="../../../download/" class="s-link">설치</a>
                <a href="../../../about/" class="s-link">About us</a>
                <a href="../../../velora/" class="s-link studio-accent">Velora Studio</a>
                
                <div class="nav-section">
                    <button class="s-link accordion-trigger" id="m-trigger-community">
                        COMMUNITY
                        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                    <div class="accordion-content" id="m-content-community">
                        <a href="../../../community/notice/" class="s-link sub">공지사항</a>
                        <a href="../../../community/free/" class="s-link sub">자유게시판</a>
                        <a href="../../../community/chat/" class="s-link sub support-highlight">1:1 CHAT</a>
                    </div>
                </div>

                <div class="nav-section">
                    <button class="s-link accordion-trigger" id="m-trigger-devlog">
                        DEVLOG
                        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                    <div class="accordion-content" id="m-content-devlog">
                        <a href="../../../devlog/update/" class="s-link sub">Update Log</a>
                        <a href="../../../devlog/bug-report/" class="s-link sub">버그 신고</a>
                    </div>
                </div>
                
                <div class="sidebar-footer">
                    <hr class="divider">
                    <div id="mobile-sidebar-auth-wrapper">
                        <div class="mobile-user-info" style="display: flex; align-items: center; gap: 8px; padding: 10px 0; color: #ffffff; font-weight: 600;">
                            <svg class="account-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <span id="mobile-user-nickname"></span>
                        </div>
                        <hr class="divider" style="border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 6px 0;">
                        <button type="button" class="s-logout-btn" style="background: none; border: none; color: #FF4B4B; font-weight: 700; padding: 10px 0; width: 100%; text-align: left; cursor: pointer;">로그아웃</button>
                        <a href="../../../account/" class="s-account-link" style="display: block; color: #8A919E; text-decoration: none; padding: 10px 0; font-size: 0.95rem;">계정</a>
                    </div>
                </div>
            </nav>
        </div>
    </aside>
    <div class="overlay" id="menu-overlay"></div>

    <div class="saas-container">
        <article class="view-card">
            <header class="view-header">
                <div class="title-area">
                    <span id="badge-target"></span>
                    <h2 id="view-title">공지사항을 불러오는 중입니다...</h2>
                </div>
                <div class="view-meta">
                    <span id="view-author">-</span>
                    <span class="meta-divider">|</span>
                    <span id="view-date">-</span>
                    <span class="meta-divider">|</span>
                    <span id="view-count">조회수 0</span>
                </div>
            </header>
            <div id="view-content" class="view-body ql-editor"></div>
        </article>

        <div class="nav-prev-next">
            <div class="nav-row" id="row-prev">
                <span class="nav-lbl">이전글</span>
                <span class="nav-title" id="prev-link">이전 글이 없습니다.</span>
            </div>
            <div class="nav-row" id="row-next">
                <span class="nav-lbl">다음글</span>
                <span class="nav-title" id="next-link">다음 글이 없습니다.</span>
            </div>
        </div>

        <div class="action-footer">
            <button class="btn-list" id="btn-go-list" onclick="location.href='../'">목록으로 돌아가기</button>
        </div>
    </div>

    <script type="module" src="../../../js/notice/notice.js"></script>
    <script type="module" src="../../../js/navbar.js"></script>
    <script type="module" src="../../../js/notification.js"></script>
</body>
</html>
